# Differential-test environment (EQLX-5). Reproducible from committed
# artifacts only: image, databases, credentials. No /tmp paths, no scratch
# container names, no manual psql. `docker compose -f test/differential/docker-compose.yml up -d`
# then EQUALIX_LIVE_COMPARE=1 with the DSNs below.
name: equalix-differential

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: x
      POSTGRES_DB: equalix
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Declarative bootstrap: role + empty databases on first start.
      # Schema is NOT here (see pg-init file header for why) — Java
      # Flyway and the harness ensureSchema own their sides' DDL.
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Databases exist (not assumed) from the pg-init mount above: cmp
  # role plus empty equalix_java/go/go2. Schema is applied by owners,
  # never by hand: Java Flyway on boot; the harness ensureSchema
  # (embedded goose set) for Go databases at test startup when tables
  # are absent, ResetDB between runs for residue. A live database that
  # did not come from this file + those two paths is ad-hoc state —
  # see spec §13 NOTE on harness reproducibility.
  # Go migrations apply from migrations/*.sql; Java Flyway migrates on boot.
  # DSNs for a default local run:
  #   Java JDBC: jdbc:postgresql://localhost:5433/equalix_java
  #   Go DSN:    postgres://cmp:x@localhost:5433/equalix_go?sslmode=disable
