# EQLX-5 differential comparison: scheduled + manual dispatch.
#
# Bump mechanism (pinned, not silent): the Java oracle SHA is a workflow
# input defaulting to the SHA in the oracle-determination entry
# (docs/spec.md §13). To move the pin, open a PR changing the default
# below — never push a SHA change directly. If the Java side moves under a
# pinned SHA run, the comparison reports mismatch (a result), not a
# workflow error; infra failures (DB unreachable, jar missing, stub
# timeout) fail the workflow distinctly from comparison mismatches.
#
# Starvation-differential caveat (CORRECTION-3): this workflow's
# differential comparison covers the promotion-deadline mechanism, not the
# harness-original K=3 window gate. A green run never claims K=3 parity —
# see README "Differential dimensions" and the maturity table.
name: differential

on:
  schedule:
    - cron: "0 3 * * *" # nightly, UTC
  workflow_dispatch:
    inputs:
      java_sha:
        description: "Pinned Java oracle commit (see spec §13 oracle determination)"
        default: "11ef025"
        required: true
      workload:
        description: "Workload file under test/differential/workloads"
        default: "w127.jsonl"
        required: true
      warmup_tasks:
        description: "Warm-up pre-phase tasks (0 = cold characterization class)"
        default: "500"
        required: false
      warmup_rps:
        description: "RPS floor the warm-up trickle gates on"
        default: "15"
        required: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Warm class is the parity gate, so CI runs warm by default; cold is
      # a dispatch-only characterization run (set warmup_tasks: 0). Empty
      # on schedule events, hence the literal fallbacks.
      EQUALIX_WARMUP_TASKS: ${{ github.event.inputs.warmup_tasks || '500' }}
      EQUALIX_WARMUP_RPS: ${{ github.event.inputs.warmup_rps || '15' }}
      EQUALIX_WARMUP_PACE: "8"
      # Nightly runs the gate workload (w2000: 2 full windows, shares gate
      # fires); manual dispatch defaults to w127 (fast, pipeline-only).
      # Measured warm legs run ~6 min each — total ~25 min against the
      # 60-min budget, so no timeout bump unless cold-runner builds slip.
      EQUALIX_WORKLOAD: ${{ github.event_name == 'schedule' && 'w2000.jsonl' || github.event.inputs.workload || 'w127.jsonl' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: equalix-go
          ref: ${{ github.ref }}

      - uses: actions/checkout@v4
        with:
          repository: synanton/equalix
          ref: ${{ inputs.java_sha }}
          path: equalix

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start Postgres
        run: docker compose -f equalix-go/test/differential/docker-compose.yml up -d --wait

      - name: Create databases
        run: |
          docker compose -f equalix-go/test/differential/docker-compose.yml exec -T postgres \
            psql -U postgres -c "CREATE USER cmp WITH PASSWORD 'x' SUPERUSER;" \
            -c "CREATE DATABASE equalix_java OWNER cmp;" \
            -c "CREATE DATABASE equalix_go OWNER cmp;" \
            -c "CREATE DATABASE equalix_go2 OWNER cmp;"

      - name: Build Go binary
        working-directory: equalix-go
        run: go build -o /tmp/equalix-go ./cmd/equalix-go

      - name: Build Java jar
        working-directory: equalix
        run: mvn -B -q package -DskipTests

      - name: Apply Go migrations
        run: |
          for f in equalix-go/migrations/0000*.sql; do
            python3 -c "
          raw = open('$f').read()
          up = raw.split('-- +goose Down')[0].replace('-- +goose Up','')
          open('/tmp/mig.sql','w').write(up)
          "
            docker cp /tmp/mig.sql "$(docker compose -f equalix-go/test/differential/docker-compose.yml ps -q postgres):/tmp/mig.sql"
            docker compose -f equalix-go/test/differential/docker-compose.yml exec -T postgres \
              psql -U cmp -d equalix_go -q -f /tmp/mig.sql
          done

      - name: Run Java-vs-Go comparison
        working-directory: equalix-go
        env:
          EQUALIX_LIVE_COMPARE: "1"
          EQUALIX_JAVA_JAR: ${{ github.workspace }}/equalix/target/equalix-1.0.0-SNAPSHOT.jar
          EQUALIX_GO_BIN: /tmp/equalix-go
          EQUALIX_JAVA_JDBC: jdbc:postgresql://localhost:5433/equalix_java
          EQUALIX_GO_DSN: postgres://cmp:x@localhost:5433/equalix_go?sslmode=disable
          EQUALIX_GO_DSN2: postgres://cmp:x@localhost:5433/equalix_go2?sslmode=disable
          EQUALIX_PG_USER: cmp
          EQUALIX_PG_PASSWORD: x
          EQUALIX_RESULTS_DIR: ${{ github.workspace }}/results-jvg
          EQUALIX_JAVA_SHA: ${{ inputs.java_sha }}
          EQUALIX_GO_SHA: ${{ github.sha }}
          # Generous startup on cold runners (Maven + Spring boot from
          # scratch); tighten once baselines exist. A genuinely broken
          # service still fails loudly naming the side.
          EQUALIX_JAVA_STARTUP_TIMEOUT: 5m
          EQUALIX_GO_STARTUP_TIMEOUT: 2m
        run: |
          # /metrics snapshots feed the runbook's loaded typicals (the
          # typicals the harness traces cannot supply — histograms live
          # in the exporters, not results.json). Filenames are seconds
          # since the loop started (offsets, not wall-clock — same
          # discipline as the workload's created_at_offset_ms, so spikes
          # correlate with run events without cross-host clock alignment).
          # Skips log to skips.log with cause: a missing snapshot is a
          # scrape-target signal (auth, path, crashed exporter), never
          # just "no data" — write-on-200-only without the log would make
          # a broken scrape target indistinguishable from a quiet one.
          # Java serves actuator, not /metrics.
          # t=0 is the loop start below (≈ step start, before either
          # service spawns — NOT first-ingest, which is unknowable this
          # early). t0.txt pins the wall-clock so offsets translate:
          # absolute = t0 + offset; workload-event offset = absolute −
          # results.json resolved.marker_{java,go}. Both T0
          # (startup.spawn) and the markers are persisted, so the
          # translation is recoverable from artifacts alone. One loop
          # clock per leg, so cross-side comparison within a leg is
          # aligned; legs have independent t0 files.
          mkdir -p ${{ github.workspace }}/results-jvg/snapshots
          (t0=$(date +%s); date -u +%FT%TZ > ${{ github.workspace }}/results-jvg/snapshots/t0.txt
          snap() { # $1=url $2=outfile: write on 200, log the skip otherwise
            body=$(curl -sf "$1" || true)
            if [ -n "$body" ]; then
              echo "$body" > "$2"
            else
              echo "$(date -u +%FT%TZ) skip $1 (non-200 or empty)" >> ${{ github.workspace }}/results-jvg/snapshots/skips.log
            fi
          }
          while true; do
            off=$(( $(date +%s) - t0 ))
            snap http://127.0.0.1:18083/actuator/prometheus ${{ github.workspace }}/results-jvg/snapshots/java-${off}s.txt
            snap http://127.0.0.1:18084/metrics ${{ github.workspace }}/results-jvg/snapshots/go-${off}s.txt
            sleep 30
          done) &
          SNAP=$!
          go test -count=1 -tags=differential -run 'TestLiveJavaVsGo' \
            ./test/differential/... 2>&1 | tee compare-jvg.log; STATUS=${PIPESTATUS[0]}
          kill $SNAP 2>/dev/null || true
          test $STATUS -eq 0

      - name: Run Go-vs-Go control
        working-directory: equalix-go
        env:
          EQUALIX_LIVE_COMPARE: "1"
          EQUALIX_GO_BIN: /tmp/equalix-go
          EQUALIX_GO_DSN: postgres://cmp:x@localhost:5433/equalix_go?sslmode=disable
          EQUALIX_GO_DSN2: postgres://cmp:x@localhost:5433/equalix_go2?sslmode=disable
          EQUALIX_PG_USER: cmp
          EQUALIX_PG_PASSWORD: x
          EQUALIX_RESULTS_DIR: ${{ github.workspace }}/results-gvg
          EQUALIX_GO_SHA: ${{ github.sha }}
          EQUALIX_GO_STARTUP_TIMEOUT: 2m
        run: |
          mkdir -p ${{ github.workspace }}/results-gvg/snapshots
          (t0=$(date +%s); date -u +%FT%TZ > ${{ github.workspace }}/results-gvg/snapshots/t0.txt
          snap() {
            body=$(curl -sf "$1" || true)
            if [ -n "$body" ]; then
              echo "$body" > "$2"
            else
              echo "$(date -u +%FT%TZ) skip $1 (non-200 or empty)" >> ${{ github.workspace }}/results-gvg/snapshots/skips.log
            fi
          }
          while true; do
            off=$(( $(date +%s) - t0 ))
            snap http://127.0.0.1:18085/metrics ${{ github.workspace }}/results-gvg/snapshots/go1-${off}s.txt
            snap http://127.0.0.1:18086/metrics ${{ github.workspace }}/results-gvg/snapshots/go2-${off}s.txt
            sleep 30
          done) &
          SNAP=$!
          go test -count=1 -tags=differential -run 'TestLiveGoVsGo' \
            ./test/differential/... 2>&1 | tee compare-gvg.log; STATUS=${PIPESTATUS[0]}
          kill $SNAP 2>/dev/null || true
          test $STATUS -eq 0

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Standing retention property: every run leaves a durable
          # results.json per pair (90 days). Separate dirs per leg —
          # both legs previously shared one dir and the control
          # overwrote the comparison's artifact.
          name: differential-results-${{ github.run_number }}-${{ github.sha }}
          retention-days: 90
          path: |
            results-jvg/
            results-gvg/
